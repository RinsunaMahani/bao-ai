[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bao-ai"
version = "0.1.0"
description = "Multilingual South African AI assistant with offline RAG and voice support."
readme = "README.md"
# 3.11, not 3.10. tomllib (the config loader) and scikit-learn 1.8+ (which
# the pickled pan-African detector needs) both require it; on 3.10 the
# config was silently ignored and pip resolved scikit-learn 1.7.2, too old
# to load the bundle faithfully. Python 3.10 reaches end of life in
# October 2026. CI tests this floor and the newest version in use.
requires-python = ">=3.11"
# Core dependencies: the app runs (offline knowledge retrieval + heuristic
# language detection, no speech, no ML classifier) with just these.
#
# These lists MIRROR the requirements-*.txt files, which are what CI, the
# Dockerfile and the README all install. Two dependency manifests that
# disagree is the same failure class as a config knob nothing reads: one
# of them is wrong and nothing says which. If you change a pin here,
# change it there too.
dependencies = [
    "streamlit>=1.40.0",
    "google-genai>=0.1.1",
    "python-dotenv>=1.0.1",
    # Pinned to the minor series the pan-African bundle was pickled in;
    # see requirements.txt, which carries the same range and the reason.
    "scikit-learn>=1.9,<1.10",
    # Imported by name in services/language_detector.py to load that
    # bundle, so it is declared rather than leaned on as a transitive
    # scikit-learn dependency.
    "joblib>=1.3.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
]

# Everything below is optional and guarded by try/except in the modules
# that use it (services/speech.py, services/language_detector.py,
# knowledge/loader.py) — a missing extra degrades one feature, it never
# crashes the app.
[project.optional-dependencies]
# Mirrors requirements-speech.txt. `edge-tts` is what produces the only
# real South African English/Afrikaans/isiZulu voices, and sounddevice /
# soundfile are what the console uses to play audio back, so all three
# belong here. `pyttsx3` was listed but is imported nowhere in the
# codebase — it is a leftover from the pre-refactor TTS path.
speech = [
    "SpeechRecognition>=3.10.0",
    "scipy>=1.13.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "torch>=2.2.0",
    # Capped below 5.0: coqui-tts imports a symbol transformers 5.x removed,
    # and config.toml ships with that voice enabled, so an uncapped resolve
    # silences seven languages on a fresh install. MMS is unaffected by the
    # cap. See the `coqui` extra below.
    "transformers>=4.57,<5",
    "edge-tts>=6.1.0",
]
# Mirrors requirements-ml.txt. The classifier needs ONE thing from the
# TensorFlow world — a TFLite interpreter — and `ai-edge-litert` is the
# standalone runtime that provides it. Full TensorFlow publishes no
# wheels for Python 3.14, so declaring it here made this extra
# uninstallable on a current Python while the code's preferred import has
# always been LiteRT. Install TensorFlow separately only to run
# convert_model.py or tests/test_tokenizer_parity.py, both of which need
# Keras itself.
ml = ["ai-edge-litert>=1.0.0"]
# The multilingual South African VITS model. A separate extra, not part of
# `speech`, because the MODEL it loads is cc-by-nc-4.0 while this project
# is MIT: installing it must be a deliberate act, not something that
# arrives with the voice extras.
#
# Three constraints found by installing it, none of which coqui-tts
# declares in a way pip resolves on its own:
#
#  - `[codec]`, because from PyTorch 2.9 audio IO needs torchcodec and
#    coqui-tts raises on import without it.
#  - torchaudio, which it imports but does not pull in.
#  - transformers <5. coqui-tts 0.27.5 imports `isin_mps_friendly` from
#    transformers.pytorch_utils, which 5.x removed; the import chain runs
#    through XTTS/Tortoise, so it breaks even though this project only
#    ever loads VITS. 4.57.6 satisfies both this and MMS.
coqui = [
    "coqui-tts[codec]>=0.27.0",
    "torchaudio>=2.0.0",
    "transformers>=4.57,<5",
]
pdf = ["pypdf>=4.0.0"]
# Mirrors requirements-semantic.txt — the alternative retrieval backend
# that compare_retrievers.py scores against TF-IDF.
semantic = ["sentence-transformers>=3.0.0"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "huggingface-hub>=0.18.0"]

[tool.setuptools.packages]
find = {}

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
