name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow token can read the repository and nothing
# else. Nothing here writes to GitHub, and a token that cannot write cannot
# be misused by a compromised test dependency to do so.
permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs, with the release named in the
# comment. A tag like @v4 can be moved to different code by whoever
# controls the action's repository; a SHA cannot. Dependabot keeps the
# pins current (.github/dependabot.yml).

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # The declared floor, and the newest version the project is
        # developed on. Two entries, not three: each job pulls the LFS
        # model assets, against a small monthly bandwidth quota.
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Keeps the token out of .git/config, where every later step -
          # including third-party code installed by pip - could read it.
          persist-credentials: false

      # checkout does NOT fetch LFS content by default, so the classifier
      # and its tokenizer arrived as pointer stubs and every TFLite test
      # skipped — CI was green on a model it never loaded.
      #
      # Fetched by name rather than with `lfs: true`, which would pull all
      # four tracked assets (~96 MB per job, doubled by the matrix, against
      # a 1 GB/month LFS quota — roughly five pushes). The other two,
      # ultimate_african_ai.keras and tokenizer.pickle, are training
      # artifacts with zero runtime references; only convert_model.py reads
      # the Keras source. 27 MB instead of 96.
      - name: Fetch the runtime model assets from LFS
        run: |
          git lfs install
          git lfs pull --include="models/language_classifier.tflite,tokenizer_config.json"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install core + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      # The on-device classifier is this project's central ML claim, so it
      # is exercised rather than skipped. ai-edge-litert is the standalone
      # LiteRT runtime — a few MB, not TensorFlow's ~600 — so this is cheap.
      # The tests self-check that the interpreter really constructed
      # (_tflite_actually_works), so a bad wheel skips instead of failing.
      - name: Install the TFLite runtime
        run: pip install -r requirements-ml.txt

      # Tokenizer parity. The app ships a from-scratch reimplementation of
      # Keras's Tokenizer so it never needs TensorFlow at runtime, and
      # tests/test_tokenizer_parity.py checks it against the real one -
      # train/serve skew that would lower accuracy without crashing
      # anything. That test skipped everywhere until 2026-09-27, when it was
      # first run (TensorFlow 2.21, Keras 3.15, Python 3.12): all ten cases
      # matched exactly. Running it here keeps it true on every push.
      #
      # 3.11 only: TensorFlow publishes no Python 3.14 wheels. Pinned to the
      # series it was verified against, because the Tokenizer it compares
      # with is Keras's legacy module, which a later Keras may drop.
      - name: Install TensorFlow for the tokenizer parity check
        if: matrix.python-version == '3.11'
        run: pip install "tensorflow-cpu>=2.21,<2.22"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest tests/ -v

      - name: Retrieval self-consistency evaluation
        run: python evaluate.py

  # Known vulnerabilities in what the app ships, checked on every change.
  # The core, ML and PDF requirements are audited: they are what the Docker
  # image and a default install contain. requirements-speech.txt is not
  # gated here - it pins transformers below 5 for coqui-tts, and every
  # transformers fix is in 5.x; SECURITY.md records why none of those
  # advisories reaches the code paths this app uses.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Audit shipped dependencies (pip-audit)
        run: |
          pip install "pip-audit==2.10.1"
          pip-audit --progress-spinner off -r requirements-ml.txt -r requirements-pdf.txt
