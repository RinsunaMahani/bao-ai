# Keeps dependencies current, including the SHA-pinned GitHub Actions and
# the digest-pinned Docker base image, which would otherwise never move.
# Updates are grouped into one pull request per ecosystem per week, so they
# arrive as a small weekly batch rather than a stream. CI runs on each one.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Only when a new release falls OUTSIDE a declared range. The ranges
    # here are floors or deliberate caps. The default strategy raised every
    # floor to the newest release - 24 changes in its first pull request -
    # forcing upgrades nothing needed, and one it would have broken: it set
    # transformers>=5.17, which coqui-tts 0.27.5 cannot import. CI passed
    # regardless, because CI does not install the speech stack.
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 3
    ignore:
      # Deliberate caps, each explained where it is declared. Written as
      # version ranges, not update-types: an update-types rule did not stop
      # Dependabot widening a cap - with it in place, it still proposed
      # transformers<6 (#8). A range names the versions never to allow.
      - dependency-name: "transformers"  # requirements-speech.txt: coqui-tts breaks on 5.x
        versions: [">=5"]
      - dependency-name: "scikit-learn"  # requirements.txt: the pickled detector is 1.9-only
        versions: [">=1.10"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    ignore:
      # The image runs the Python version CI tests as the floor. Moving it
      # (the first proposal was 3.11 to 3.14) is a decision, not an update;
      # new digests of 3.11-slim, which carry the security patches, still
      # come through.
      - dependency-name: "python"
        versions: [">=3.12"]
