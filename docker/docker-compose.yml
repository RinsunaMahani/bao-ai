services:
  bao-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bao-ai
    ports:
      # This machine only. A bare "8501:8501" publishes on every network
      # interface of the host, which puts the app, and the API key behind
      # it, on the local network. To share it deliberately, change this to
      # "8501:8501".
      - "127.0.0.1:8501:8501"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    # Optional on purpose. The app runs fully offline without an API key,
    # but a plain `- ../.env` made compose refuse to start at all on a
    # fresh clone - "env file not found" - so the offline demo was
    # unreachable by exactly the people who had not set up a key yet.
    env_file:
      - path: ../.env
        required: false
    volumes:
      # Mount workspace subfolders for real-time development without
      # rebuilding. Read-only: the app never writes to them, and a
      # compromised process must not be able to change the code or data
      # the next run loads.
      - ../models:/app/models:ro
      - ../data:/app/data:ro
      - ../bao:/app/bao:ro
    # Standard container hardening: no privilege escalation (setuid
    # binaries cannot gain rights), and no Linux capabilities, none of
    # which a web app on an unprivileged port needs.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
