services:
  bao-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bao-ai
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    # Optional on purpose. The app runs fully offline without an API key,
    # but a plain `- ../.env` made compose refuse to start at all on a
    # fresh clone - "env file not found" - so the offline demo was
    # unreachable by exactly the people who had not set up a key yet.
    env_file:
      - path: ../.env
        required: false
    volumes:
      # Mount workspace subfolders for real-time development without rebuilding
      - ../models:/app/models
      - ../data:/app/data
      - ../bao:/app/bao
    restart: unless-stopped